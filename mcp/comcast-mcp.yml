candidate_note: 'If Comcast were to expose Firebolt as MCP tools, the contract already supplies everything
  an MCP server needs: each method name is a tool name, its OpenRPC params schema is the tool inputSchema
  verbatim, and its capability URNs are the authorization the tool would need. The 97 event methods are
  subscriptions rather than callable tools and would map to MCP notifications, not tools; they are marked
  kind: event below. IMPORTANT CAVEAT: Firebolt is an ON-DEVICE JSON-RPC interface between an app and
  a set-top box, not a network API. There is no remote endpoint for an agent to reach, which is why mode
  is none rather than unknown.'
