specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Comcast
providerId: comcast
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Rate Limiting
  - Telecommunications
  - Cable
description: Comcast does not publish a public API rate-limit reference. Partner-facing X1/Flex APIs are
  governed by the developer portal's terms of service rather than a public throttling spec.
sources:
  - https://developer.comcast.com/
  - https://developers.xfinity.com/TOS.html
notes: No public rate-limit numbers; throttling is partner-contract governed.
responseCodes:
  throttled: 429
limits:
  - name: X1 / Flex partner APIs (undocumented)
    scope: partner
    metric: varies
    limit: see partner documentation
policies:
  - name: Backoff
    description: Use exponential backoff with jitter on 429/503 responses; respect Retry-After if present.
  - name: Partner-governed
    description: Throughput governed by partner publisher agreement and X1/Flex platform certification.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
