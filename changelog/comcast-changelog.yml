# Comcast — Firebolt API release history
#
# Comcast publishes no dated changelog page on docs.developer.comcast.com. What
# it publishes instead is the versioned specification itself: tagged releases of
# the Firebolt OpenRPC contracts, and a full side-by-side reference for four
# API versions on the docs host. This artifact records that, from the tags and
# from the version-stamped documents in openrpc/ — not from a changelog page
# that does not exist.
