anchor_entities:
- entity: Entertainment.EntityInfo
  why: The central content record. Everything Discovery exchanges with an app hangs off it.
- entity: Entertainment.WayToWatch
  why: How a given EntityInfo can actually be watched — the offering/entitlement join.
- entity: Entertainment.ContentIdentifiers
  why: The identity type. Firebolt correlates content across systems here rather than with a foreign key.
- entity: Capabilities.CapabilityInfo
  why: 'The authorization record: capability + supported/available + per-role permission status + deny
    reasons.'
- entity: GrantInfo
  why: A user grant of one capability to one app in one role — the Manage-SDK side of the same model.
