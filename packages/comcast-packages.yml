# Comcast — first-party client packages
#
# OWNERSHIP (STEP 0c). The @firebolt-js/* packages are published from the
# rdkcentral GitHub organization, NOT from github.com/Comcast, so the domain
# check needs stating: Firebolt is Comcast's connected-TV application platform,
# its reference documentation is served by Comcast at
# docs.developer.comcast.com/docs/firebolt-apis, and the npm maintainers of
# record on @firebolt-js/sdk are Comcast and Sky (a Comcast company) staff
# addresses — jeremy.lacivita@comcast.com, kevin_pearson@cable.comcast.com,
# joseph_martin@cable.comcast.com, adam.czynszak@sky.uk. RDK Central is the
# open-source home Comcast publishes the platform through; the packages are
# first-party Comcast work distributed under Apache-2.0.
