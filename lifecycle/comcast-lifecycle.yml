  url: http://x-ottapp.comcast.com
  regional_contact: Partner_Mgmt@sky.uk
  regional_note: >-
    Several docs pages state they apply to North America only and route
    non-North-American partners to Sky partner management.
  source: https://docs.developer.comcast.com/docs/getting-help
