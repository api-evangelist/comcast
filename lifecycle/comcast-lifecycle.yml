sla:
  published: true
  kind: partner incident-response obligation
  direction: >-
    NOTE THE DIRECTION. This is not an availability commitment Comcast makes to
    a partner; it is the response and resolution time Comcast REQUIRES OF the
    partner for issues in the partner's app. It is the only dated SLA table on
    the public developer surface.
  source: https://docs.developer.comcast.com/docs/incident-priority-levels
  tiers:
    - priority: P0 - Critical
      response_time: 30 minutes
      resolution_time: 4 hours
      definition: Essential features of the app do not work, or the app is completely unusable.
    - priority: P1 - Urgent
      response_time: 1 hour
      resolution_time: 8 hours
      definition: >-
        Nonessential features do not work in a way that hinders proper app usage,
        or issues that could weaken system integrity over time.
    - priority: P2 - Important
      response_time: 1 business day
      resolution_time: 2 business days
      definition: Problems that cause operational difficulties within the app.
    - priority: P3 - Monitor
      response_time: 2 business days
      resolution_time: 1 week
      definition: Problems that may cause minor operational difficulties, or general customer queries.
    - priority: P4 - Information
      response_time: 1 week
      resolution_time: When commercially feasible
      definition: Comments and suggestions on services, technical features, design, or other similar topics.

release_process:
  name: Staged app deployment
  source: https://docs.developer.comcast.com/docs/app-deployment-process
  description: >-
    A multi-week staged rollout across set-top-box groups. At each stage the
    app's Error Free Session Rate and Time To Minimally Usable metrics are
    monitored against target numbers; the process ends at 100% general
    availability, at which point the App Dashboard status becomes "Live".
  certification_required: true
  certification_docs:
    - https://docs.developer.comcast.com/docs/deliverables-and-certification-requirements
    - https://docs.developer.comcast.com/docs/self-certification-requirements-checklist
    - https://docs.developer.comcast.com/docs/certification-lab

status_page:
  published: false
  probed: true
  note: >-
    No public status page found for the developer platform. Incident handling is
    routed through a partner manager and the support center at
    http://x-ottapp.comcast.com (per
    https://docs.developer.comcast.com/docs/getting-help), which is a
    partner-authenticated channel, not a public status surface.

support:
