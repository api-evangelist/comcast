  openrpc/comcast-firebolt-{core,manage,discovery}-openrpc.json v1.7.0;
  https://docs.developer.comcast.com/docs/incident-priority-levels;
  https://docs.developer.comcast.com/docs/app-deployment-process;
  https://docs.developer.comcast.com/llms.txt (all fetched 2026-09-05)
