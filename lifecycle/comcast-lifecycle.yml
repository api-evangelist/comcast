    date: '2026-03-31'
    source: https://github.com/rdkcentral/firebolt-apis/releases
    note: Not promoted to the npm `latest` tag; npm latest is still 1.7.0 (2025-09-04).
  legacy_track:
    name: X1 JavaScript API ("Badger")
    status: legacy, superseded by Firebolt
    migration_guide: https://docs.developer.comcast.com/docs/badger-to-firebolt-reference
    note: >-
      Comcast keeps the full legacy reference published alongside a
      Badger-to-Firebolt mapping table — a migration path, not a silent removal.

deprecation_policy:
  published_policy_page: false
  sunset_header_rfc8594: false
  in_contract: true
  mechanism: >-
    A `deprecated` tag on the method in the OpenRPC document, carrying x-since
    (the version it was deprecated in) and, usually, x-alternative (the
    replacement). Deprecated methods remain published and callable in 1.7.0;
    none of the 20 has been removed from the current contract.
  note: >-
    There is no dated sunset policy, no Deprecation/Sunset response header and
    no removal calendar. What exists is an in-contract marker plus a named
    replacement, which is more than most providers ship and less than a policy.

