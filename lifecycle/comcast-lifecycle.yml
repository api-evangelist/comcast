# Comcast — API lifecycle, versioning and deprecation
#
# The strongest lifecycle signal Comcast publishes is inside the contract, not
# on a policy page: 20 of the 330 Firebolt methods carry an explicit
# `deprecated` tag, and 17 of those name both the version they were deprecated
# in and the method that replaces them. That is machine-readable deprecation,
# and it is derived below verbatim from the OpenRPC documents in openrpc/.
