specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Comcast
providerId: comcast
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - FinOps
  - FOCUS
  - Telecommunications
  - Cable
description: 'FOCUS-aligned FinOps for Comcast: consumer/business telecom services priced per published
  consumer plans; no public API consumption pricing. Meters cover invoice abstractions for Xfinity Business
  and X1/Flex partner relationships.'
sources:
  - https://developer.comcast.com/
  - https://www.xfinity.com/business
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Comcast Cable Communications, LLC
serviceCategory: Telecommunications
billingModel:
  pricingCategory: Subscription
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Usage
    - Tax
    - Adjustment
    - Refund
focusColumns:
  ServiceName: Comcast / Xfinity
  ServiceCategory: Telecommunications
  ProviderName: Comcast
  PublisherName: Comcast Cable Communications, LLC
  InvoiceIssuerName: Comcast Cable Communications, LLC
  BillingCurrency: USD
meters:
  - name: business_internet_subscription
    unit: month
    aggregation: sum
    dimensions:
      - service_tier
      - location
  - name: voice_lines
    unit: line-month
    aggregation: sum
  - name: tv_video
    unit: month
    aggregation: sum
    dimensions:
      - package
  - name: equipment_rental
    unit: month
    aggregation: sum
    dimensions:
      - device_type
principles:
  - name: Visibility
    description: Reconcile Xfinity Business invoices monthly; pull line-of-business breakdown from the
      Xfinity Business portal.
  - name: Allocation
    description: Tag service IDs to site, cost center, or business unit.
  - name: Optimization
    description: Right-size service tier per location; consolidate invoices; review at contract renewal.
  - name: Accountability
    description: IT or facilities owns each circuit/site; finance owns multi-year contract decisions.
notes: No public API consumption pricing; meters cover commercial telecom invoice lines.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
