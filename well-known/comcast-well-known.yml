# Comcast — /.well-known/ discovery probe
#
# Probed 2026-09-05 across every host this record knows: the registrable domain
# and www, both API baseURL hosts, the docs host, the developer portal host and
# the Xfinity developer host.
#
# ONE real document was served: an OAuth/OIDC discovery document on the Comcast
# SAT (Security Access Token) host, sat-prod.codebig2.net — the host apis.yml
