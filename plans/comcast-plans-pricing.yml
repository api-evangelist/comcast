description: Comcast operates a developer portal (developer.comcast.com) for the Xfinity X1/Flex application
  platform and other internal-partner APIs, but does not publish public API pricing tiers. Consumer products
  (Xfinity Internet, Mobile, TV) and Comcast Business services are priced via the consumer site, not via
  a developer pricing page.
sources:
  - https://developer.comcast.com/
  - https://docs.developer.comcast.com/
notes: No public developer/API pricing tiers; X1/Flex app development is for partner publishers via the
  developer portal.
plans:
  - id: comcast-developer-portal
    name: Comcast Developer Portal
    type: enterprise
    description: App development for Xfinity X1 and Flex platforms; access requires registration as a
      partner publisher. No public price list.
    entries:
      - label: Partner publisher access
        name: partner_access
        type: subscription
        metric: contract
        limit: -1
        timeFrame: month
        geo: US
        unit: 1
        price: contact developer relations
        userMultiplied: false
    elements:
      - name: Xfinity X1 Platform
      - name: Flex Platform
      - name: Authentication API
