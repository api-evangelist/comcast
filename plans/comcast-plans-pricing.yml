plan_count: 0
description: >-
  Comcast publishes NO developer plans and NO API pricing of any kind. There are
  no tiers, no free tier, no quotas, no overage rates and no "contact sales"
  price list. Access to the Firebolt developer platform is not purchased at all:
  it is granted by invitation. Comcast's own onboarding page states that "our
  partner engagement team will invite the designated primary contacts to
  register for the portal", after which the organization completes an
  organization profile and a per-app profile, both of which Comcast reviews.
  There is no self-serve path and no price attached to any step.
pricing_page_published: false
pricing_page_note: >-
  The 351-entry docs index at https://docs.developer.comcast.com/llms.txt
  contains no pricing, plans or billing page. Consumer Xfinity products
  (Internet, Mobile, TV) and Comcast Business services are priced on the
  consumer site; that is retail telecom pricing, not API pricing, and is
  deliberately not recorded here as a developer plan.

access_model:
  onboarding: invitation-only
  self_serve: false
  free_tier: false
  trial: false
  gating:
    - Invitation from the Comcast partner engagement team.
    - Organization profile submitted and reviewed by Comcast.
    - App profile submitted and reviewed by Comcast, per app.
    - Program Agreement signed — required of ALL partners.
    - >-
      Distribution Agreement signed — required only for apps distributed on
      Xfinity / Xumo. Terms for other distributors are handled outside the portal.
    - App certification passed before production launch.
  portal: https://developer.comcast.com/portal/dashboard
  regional_note: >-
    Several onboarding and requirements pages state they apply to North America
    only; non-North-American partners are routed to Sky partner management
    (Partner_Mgmt@sky.uk).

open_source_note: >-
  One part of the surface IS free and unconditional: the Firebolt specification
  and SDKs are published under Apache-2.0 on npm and github.com/rdkcentral. An
  engineer can read the full 330-method contract and build against Mock Firebolt
  without any Comcast relationship. What the invitation gates is not the API
  documentation — it is distribution on Comcast devices.

plans: []
