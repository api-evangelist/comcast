description: >-
  Comcast Corporation is a global media and technology company with two primary
  businesses, Comcast Cable (Xfinity) and NBCUniversal, providing video,
  internet, voice, wireless, and entertainment services to residential and
  business customers. Comcast publishes a public developer program centered on
  the Firebolt application platform for connected TV experiences, along with
  authentication and content ingest endpoints used by NBCUniversal media
  partners. The Firebolt SDK family is used by app developers to write apps
  once and deploy across Xfinity X1, Xfinity Flex, Sky Q, and other Comcast
  set-top boxes and connected devices.
