        type: Repository
        name: Firebolt OpenRPC schemas and SDK artifact configurations
      - url: https://github.com/rdkcentral/firebolt-openrpc
        type: Repository
        name: Firebolt SDK code and doc generator
    description: >-
      Firebolt is Comcast's application platform for building apps that run on
      TVs, set-top boxes, and other connected home devices. The Firebolt SDK
      exposes a family of JavaScript APIs (Lifecycle, Metrics, Device,
      Authentication, Discovery, Profile, Localization, Account) that let
      developers write once and deploy to any supported device. Firebolt is
      defined with OpenRPC and ships as a publicly hosted npm package
      (@firebolt-js/sdk) with zero runtime dependencies.
    x-features:
      - OpenRPC-defined JSON-RPC interface across modules
      - Lifecycle, Metrics, Device, Authentication, Discovery, Profile modules
      - JavaScript SDK distributed via npm with zero dependencies
      - Reference implementations and certification tooling
      - Targets Xfinity X1, Xfinity Flex, Sky Q, and other connected devices
    x-use-cases:
      - Building streaming/entertainment apps for Comcast set-top boxes
      - Cross-device TV app distribution from a single codebase
      - Capturing standardized app health and usage metrics
      - Driving sign-in/entitlement flows on connected TV devices
  - aid: comcast:authentication-api
    name: Comcast Authentication API (SAT)
    tags:
      - Authentication
      - Tokens
    tags_raw:
      - Authentication
      - OAuth
      - Tokens
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    baseURL: https://sat-prod.codebig2.net
    humanURL: https://docs.developer.comcast.com/docs/endpoints
    properties:
      - url: https://docs.developer.comcast.com/docs/endpoints
        type: Documentation
      - url: https://docs.developer.comcast.com/docs/081-core-authentication
        type: APIReference
        name: Firebolt Authentication module (on-device tokens, 0.8.1)
      - url: well-known/comcast-sat-openid-configuration.json
        type: WellKnown
        name: SAT OAuth authorization-server metadata, served at /.well-known/openid-configuration (HTTP 200, fetched 2026-09-05)
    description: >-
      The Comcast Security Access Token (SAT) endpoint issues short-lived
      bearer tokens used to authenticate calls to Comcast partner APIs such
      as the Open Ingest service. Clients exchange an x-client-id and
      x-client-secret pair for an OAuth-style access token valid for 24
      hours, which is then attached to subsequent requests in the
      Authorization header.
    x-features:
      - Client-credential token exchange
      - 24-hour bearer token lifetime
      - x-client-id / x-client-secret request headers
    x-use-cases:
      - Authenticating against NBCUniversal partner ingest workflows
      - Obtaining access tokens for Comcast media platform APIs
  - aid: comcast:open-ingest-api
    name: Comcast Open Ingest API
    tags:
      - Ingest
      - Media
      - Metadata
      - NBCUniversal
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
    baseURL: https://compass-mmpwebservice-prod.codebig2.net
    humanURL: https://docs.developer.comcast.com/docs/endpoints
    properties:
      - url: https://docs.developer.comcast.com/docs/endpoints
        type: Documentation
    description: >-
      The Comcast Open Ingest endpoint accepts metadata and content asset
      packages from NBCUniversal media partners. Clients POST an XML payload
      describing assets to the Merlin ingest proxy, authenticated with a
      Comcast SAT bearer token and partnered through partner identifiers
      such as globalott. The endpoint returns an OpenIngestResult document
      with per-asset outcome status.
    x-features:
      - XML asset and metadata submission
      - Bearer-token authentication via Comcast SAT
      - Partner-scoped ingestion (e.g. globalott)
      - OpenIngestResult outcome reporting
    x-use-cases:
      - Submitting media metadata to NBCUniversal pipelines
      - Bulk content publication for OTT distribution
